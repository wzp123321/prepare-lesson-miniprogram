# ============================================================
# 开发环境（SPRING_PROFILES_ACTIVE=dev，默认）
# 目标：本机 MySQL，开 SQL 日志与 debug，便于本地调试。
#
# 任一项可用环境变量 / 命令行参数覆盖：
#   --DB_HOST=localhost --DB_PORT=3306 --DB_NAME=lesson_db \
#   --DB_USER=root --DB_PASSWORD=你的密码
# ============================================================
spring:
  datasource:
    # 默认连本机；如需连远端库，覆盖 DB_HOST=47.116.35.76
    # characterEncoding 取 Java 字符集名 UTF-8（不是 MySQL 的 utf8mb4），utf8mb4 驱动不识别
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lesson_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    # 调试用：在控制台打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.lesson.schedule: debug
