# ============================================================
# 开发环境（SPRING_PROFILES_ACTIVE=dev，默认）
# 目标：本机 MySQL，开 SQL 日志与 debug，便于本地调试。
#
# 任一项可用环境变量 / 命令行参数覆盖：
#   --DB_HOST=localhost --DB_PORT=3306 --DB_NAME=lesson_db \
#   --DB_USER=root --DB_PASSWORD=你的密码
# ============================================================
spring:
  # 智能排课 DeepSeek：默认取 application.yml 的 spring.ai.openai.api-key。
  # 若本环境要用另一个 Key，取消下面注释并填写（覆盖公共配置）：
  # ai:
  #   openai:
  #     api-key: sk-本环境专用key
  datasource:
    # 默认连本机；如需连远端库，覆盖 DB_HOST=47.116.35.76
    # characterEncoding 取 Java 字符集名 UTF-8（不是 MySQL 的 utf8mb4），utf8mb4 驱动不识别
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lesson_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    # 不打印 SQL：StdOutImpl 会把每条语句 + 参数 + 结果集全量刷到控制台，日志完全没法看。
    # 需要临时排查单条 SQL 时，启动时加 --mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    # info 级：只保留业务日志与异常堆栈，不输出 MyBatis 的 debug 流水
    com.lesson.schedule: info
